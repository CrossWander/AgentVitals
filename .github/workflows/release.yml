# Сборка по релизу: опубликовали релиз на GitHub — exe собирается из его тега и прикладывается к нему.
# В git exe не хранится: так видно, из каких исходников он собран, и история не пухнет на 27 МБ за выпуск.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    # Тег — через переменную, а не подстановкой в скрипт: так его текст не может стать командой.
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AgentVitals.slnx

      # Версия exe — из тега релиза: номер не нужно менять ещё и в csproj.
      - name: Build
        run: ./tools/publish.ps1 -Version $env:TAG

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG release/AgentVitals.exe --clobber
